
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cinematika: tu catálogo personal de películas.">
    <title>Cinematika | Catálogo de películas</title>
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/main.js"></script>
</head>
<body>
    <header class="encabezado">
        <h1>🎬 Cinematika</h1>
        <p>Tu próximo plan empieza con una película.</p>
    </header>

    <main class="contenedor">
        <section class="panel-bienvenida">
            <h2>¡Bienvenida a Cinematika!</h2>
            <p>Organizá tus películas favoritas en un solo lugar.</p>
            <p id="mensaje-temporizador" class="mensaje-temporizador" aria-live="polite"></p>
        </section>

        <section class="panel">
            <h2>Agregar una película</h2>

            <form id="formulario-pelicula">
                <label for="nombre">Nombre de la película</label>
                <input
                    type="text"
                    id="nombre"
                    placeholder="Ej.: Interestelar"
                    required
                >

                <label for="duracion">Duración en horas</label>
                <input
                    type="number"
                    id="duracion"
                    min="1"
                    step="1"
                    placeholder="Ej.: 3"
                    required
                >

                <label for="genero">Género</label>
                <select id="genero" required>
                    <option value="">Seleccioná un género</option>
                    <option value="Acción">Acción</option>
                    <option value="Animación">Animación</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Comedia">Comedia</option>
                    <option value="Drama">Drama</option>
                    <option value="Fantasía">Fantasía</option>
                    <option value="Terror">Terror</option>
                    <option value="Ciencia ficción">Ciencia ficción</option>
                    <option value="Otro">Otro</option>
                </select>

                <button type="submit">Agregar película</button>
            </form>
        </section>

        <section class="panel">
            <div class="titulo-catalogo">
                <h2>Mi catálogo</h2>
                <span id="contador">Cargando...</span>
            </div>

            <label for="buscador">Buscar por nombre</label>
            <input
                type="search"
                id="buscador"
                placeholder="Escribí el nombre de una película..."
            >

            <p id="estado-carga" class="estado-carga" aria-live="polite">
                Preparando el catálogo...
            </p>

            <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

            <div id="catalogo-peliculas" class="catalogo-peliculas"></div>
        </section>
    </main>

    <footer class="pie">
        <p>© 2026 Cinematika | Tu espacio para el cine</p>
    </footer>
</body>
</html>
